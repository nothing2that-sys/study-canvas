<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>국어·영어 새 판본 검토</title><style>body{font:18px/1.7 system-ui;background:#eef2f6;color:#142136;max-width:1050px;margin:auto;padding:24px}header,article{background:white;padding:24px;border-radius:14px;margin-bottom:20px}button,select{font:inherit;padding:10px;margin:6px;border:1px solid #aab;border-radius:8px}#prompt{white-space:pre-wrap;overflow-wrap:anywhere}#choices button{display:block;text-align:left;width:100%}#explanation{white-space:pre-wrap}small{display:block}a{color:#164eb2}</style><header><h1>국어·영어 새 판본 검토</h1><p>출처·정답·화면을 확인하는 검토본입니다. 문항별 근거 확인 화면입니다. 사람 승인 기록을 만들지 않습니다.</p><label>과목 <select id="subject"><option value="korean">국어</option><option value="english">영어</option></select></label><label>영역 <select id="skill"></select></label><label for="query">문항 검색</label> <input id="query" placeholder="문항 ID 또는 내용" style="font:inherit;padding:10px;max-width:90%"><p>검토 수행: CODEX_AI · 사람 검토 기록 없음</p><p id="count"></p><a href="NOTICES.txt">출처·이용 안내</a> · <a href="readiness.json">준비 상태</a> · <a href="placement-review.json">학년·난이도 배치안</a></header><article><p id="position"></p><h2 id="prompt"></h2><div id="choices"></div><button id="show">정답·해설 확인</button><section id="answer" hidden><strong id="key"></strong><p id="explanation"></p><small id="source"></small><small id="placement"></small></section><button id="previous">이전</button><button id="next">다음</button><small id="itemId"></small></article><script type="module">const data=await(await fetch('./items.json')).json();const activities=data.activities;const placements=await(await fetch("./placement-review.json")).json();const placementById=new Map(placements.items.map(p=>[p.activityId,p]));let index=0,items=[];const byId=id=>document.getElementById(id);const names={KO_SPACING_PARTICLE_REBUILD:'조사 붙여 쓰기',KO_BANK_A_NOUN_SPACING:'의존명사·명사 띄어쓰기',KO_BANK_A_UNIT_SPACING:'단위 띄어쓰기',KO_BANK_A_PUNCTUATION:'문장 부호',KO_REVIEW_READING_COMPREHENSION:'글의 내용 이해',KO_REVIEW_VOCAB_CONTEXT:'문맥 속 낱말 뜻',EN_VOCAB_MEANING:'영어 단어 뜻',EN_VOCAB_CONTEXT:'짧은 글에서 정보 찾기',EN_WORD_CORRECT_FORM:'영어 어형 선택',EN_WORD_WRITE:'영어 단어 쓰기',EN_EXPRESSION_SITUATION:'상황에 맞는 표현',EN_EXPRESSION_COMPLETION:'표현 완성',EN_SENTENCE_MEANING:'영어 문장 뜻',EN_SENTENCE_NATURAL_FORM:'자연스러운 영어 문장'};function render(){for(const id of ['show','previous','next'])byId(id).disabled=!items.length;if(!items.length){byId('prompt').textContent='검색 조건에 맞는 문항이 없습니다.';byId('choices').replaceChildren();byId('answer').hidden=true;byId('position').textContent='0 / 0';byId('itemId').textContent='';byId('count').textContent='검색 결과 0개';return}const a=items[index];const p=placementById.get(a.id);byId('placement').textContent=p?('AI 배치안: '+p.proposal.gradeLevel+'학년 / '+p.proposal.semester+' / '+(p.proposal.difficulty??'난이도 보류')+' · '+(p.status.startsWith('HOLD')?'개별 근거 보완 필요':'부분 연계·프로젝트 배치')+' · 학습자 검증 전'):'';byId('position').textContent=(index+1)+' / '+items.length;byId('prompt').textContent=a.prompt;byId('itemId').textContent=a.id+' · VERIFIED (AI 검토)';byId('choices').replaceChildren();for(const c of a.choices??[]){const b=document.createElement('button');b.type='button';b.textContent=c.text??c.label??c;b.onclick=()=>{for(const x of byId('choices').children)x.style.background='';b.style.background='#dceafb'};byId('choices').append(b)}byId('answer').hidden=true;const selected=a.choices?.find(c=>c.id===a.expectedAnswer);byId('key').textContent='기준 답: '+(selected?.text??selected?.label??a.expectedAnswer);byId('explanation').textContent=a.gradingReference?.explanation??a.explanation??'';byId('source').textContent=a.sourceMetadata.attribution+' | '+a.sourceMetadata.license+' | '+(a.sourceMetadata.sourceUri??a.metadata.ruleReference??'문항별 근거는 source-evidence.json 참조');byId('count').textContent='전체 검토 문항 '+activities.length+'개 · 현재 영역 '+items.length+'개'}function selectSkill(){items=activities.filter(a=>a.subjectId===byId('subject').value&&(!byId('skill').value||a.skillId===byId('skill').value)&&(!byId('query').value||(a.id+' '+a.prompt).toLowerCase().includes(byId('query').value.toLowerCase())));index=0;render()}function selectSubject(){byId('skill').replaceChildren();const all=document.createElement('option');all.value='';all.textContent='전체 영역';byId('skill').append(all);for(const s of [...new Set(activities.filter(a=>a.subjectId===byId('subject').value).map(a=>a.skillId))]){const o=document.createElement('option');o.value=s;o.textContent=names[s]??s;byId('skill').append(o)}selectSkill()}byId('query').oninput=selectSkill;byId('subject').onchange=selectSubject;byId('skill').onchange=selectSkill;byId('show').onclick=()=>byId('answer').hidden=false;byId('next').onclick=()=>{index=(index+1)%items.length;render()};byId('previous').onclick=()=>{index=(index+items.length-1)%items.length;render()};selectSubject();</script></html>
